services:
  post-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: post_service_app
    ports:
      - "${HOST_PORT:-8004}:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: "${ENVIRONMENT:-production}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      PORT: "8000"
      DATABASE_URL: "postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB}"
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:8000,http://localhost:8000,http://localhost:5173,http://127.0.0.1:5173}"
      USER_SERVICE_URL: "${USER_SERVICE_URL:-http://user-service:8000}"
      STORAGE_TYPE: "${STORAGE_TYPE:-local}"
      LOCAL_STORAGE_DIR: "/app/uploads"
    volumes:
      - media_data:/app/uploads
    networks:
      - post-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: post_service_postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - post-network
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  media_data:
    driver: local

networks:
  post-network:
    name: post-network
    driver: bridge
